name: Test and build ClipVault
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-linux-${{ matrix.python }}
          path: test-results/
  windows-build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Build Windows onedir executable
        run: python scripts/build.py
      - name: Check frozen startup and exit with an isolated profile
        run: python scripts/smoke_bundle.py
      - name: Build standalone Windows executable
        run: python scripts/build.py --onefile
      - name: Check standalone startup and exit
        run: python scripts/smoke_bundle.py dist/ClipVault.exe
      - name: Upload complete onedir folder
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-windows-x64-onedir
          path: dist/ClipVault/
          if-no-files-found: error
      - name: Upload standalone executable and notices
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-windows-x64-onefile
          path: |
            dist/ClipVault.exe
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            dist/licenses/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-windows
          path: test-results/
  release-preview:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.4.0-preview.1' }}"
    needs: [test, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClipVault-windows-x64-onedir
          path: release/onedir
      - uses: actions/download-artifact@v4
        with:
          name: ClipVault-windows-x64-onefile
          path: release/onefile
      - name: Package executable, complete folder and notices
        shell: bash
        run: |
          set -euo pipefail
          test -f release/onedir/ClipVault.exe
          test -f release/onefile/ClipVault.exe
          (cd release/onedir && zip -qr ../ClipVault-0.4.0-preview.1-windows-x64.zip .)
          (cd release/onefile && zip -qr ../ClipVault-0.4.0-preview.1-licenses.zip LICENSE THIRD_PARTY_NOTICES.md licenses)
          cp release/onefile/ClipVault.exe release/ClipVault-0.4.0-preview.1-windows-x64.exe
          (cd release && sha256sum ClipVault-0.4.0-preview.1-windows-x64.zip ClipVault-0.4.0-preview.1-windows-x64.exe ClipVault-0.4.0-preview.1-licenses.zip > SHA256SUMS.txt)
      - name: Publish preview release and Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.0-preview.1 \
            release/ClipVault-0.4.0-preview.1-windows-x64.exe \
            release/ClipVault-0.4.0-preview.1-windows-x64.zip \
            release/ClipVault-0.4.0-preview.1-licenses.zip \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "ClipVault 0.4.0 Preview 1 — Windows 11 界面与批量复制" \
            --notes-file docs/RELEASE_NOTES_0.4.0.md
